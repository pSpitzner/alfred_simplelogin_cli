name: Build and release Alfred workflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync project environment
        run: uv sync --locked

      - name: Run tests
        run: uv run --with pytest pytest -q

      - name: Build Alfred workflow
        run: uv run python alfred/build_workflow.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogin-alfred-workflow
          path: dist/SimpleLogin.alfredworkflow
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/SimpleLogin.alfredworkflow
