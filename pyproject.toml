[project]
name = "simplelogin-cli"
version = "0.1.0"
description = "Small Typer CLI for SimpleLogin aliases and reverse aliases."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "typer>=0.12,<1",
]

[project.scripts]
sl = "simplelogin_cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
